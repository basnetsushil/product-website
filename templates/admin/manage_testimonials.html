{% extends "base.html" %}
{% block content %}
<div class="flex min-h-screen pt-20">
    <!-- Sidebar (Same as above) -->
    <main class="flex-1 p-8">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-3xl font-bold text-gradient">Manage Testimonials</h1>
                <a href="{{ url_for('add_testimonial') }}" class="bg-white text-black px-6 py-2 rounded-full font-bold hover:bg-neutral-200 transition-all">+ Add Testimonial</a>
            </div>
            <div class="glass rounded-3xl overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-white/5 text-neutral-400 uppercase text-xs">
                        <tr><th class="px-6 py-4">Customer</th><th class="px-6 py-4">Company</th><th class="px-6 py-4">Rating</th><th class="px-6 py-4 text-right">Actions</th></tr>
                    </thead>
                    <tbody class="divide-y divide-white/5">
                        {% for t in testimonials %}
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="px-6 py-4 font-medium">{{ t.customer_name }}</td>
                            <td class="px-6 py-4 text-neutral-400">{{ t.company }}</td>
                            <td class="px-6 py-4 text-yellow-500">{{ t.rating }} ★</td>
                            <td class="px-6 py-4 text-right space-x-3">
                                <a href="{{ url_for('edit_testimonial', id=t.id) }}" class="text-blue-400 hover:underline">Edit</a>
                                <a href="{{ url_for('delete_testimonial', id=t.id) }}" class="text-red-400 hover:underline" onclick="return confirm('Delete testimonial?')">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
{% endblock %}
